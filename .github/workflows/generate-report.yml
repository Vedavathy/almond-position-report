name: Generate Almond Position Report

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Report month (e.g., June)'
        required: true
        type: string
      year:
        description: 'Report year (e.g., 2026)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run report generation pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/generate-report.ts "${{ github.event.inputs.month }}" "${{ github.event.inputs.year }}"

      - name: Commit and push generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..
          MONTH_LOWER=$(echo "${{ github.event.inputs.month }}" | tr '[:upper:]' '[:lower:]')
          git add app/src/content/reports/${MONTH_LOWER:0:3}-${{ github.event.inputs.year }}.mdx
          git add app/src/data/historical-data.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "feat: add ${{ github.event.inputs.month }} ${{ github.event.inputs.year }} position report

          Auto-generated by the report pipeline.

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push
